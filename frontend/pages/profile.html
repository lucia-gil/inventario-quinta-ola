<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil | Quinta Ola</title>
  <link href="/src/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-body">

  <main class="page-main-narrow">

    <div class="page-header">
      <div>
        <h1 class="page-title">Mi Perfil</h1>
        <p class="page-subtitle">Información personal y configuración de tu cuenta</p>
      </div>
    </div>

    <div class="panel p-8 text-center relative overflow-hidden shadow-sm border border-gray-100 rounded-2xl bg-white">
      <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-accent to-pink-500"></div>
      
      <div class="relative w-28 h-28 mx-auto mb-4 group cursor-pointer">
        <input type="file" id="avatar-input" class="hidden" accept="image/png, image/jpeg, image/jpg" />
        
        <div id="profile-avatar-container" class="w-full h-full rounded-full flex items-center justify-center text-3xl font-bold shadow-inner border-2 border-white ring-4 ring-gray-50 overflow-hidden transition-all duration-300 group-hover:ring-accent/20">
          <span id="avatar-initials">—</span>
          <img id="avatar-img" src="" alt="Avatar" class="w-full h-full object-cover hidden" onerror="this.classList.add('hidden'); document.getElementById('avatar-initials').classList.remove('hidden');" />
        </div>

        <div id="avatar-overlay" class="absolute inset-0 bg-black/50 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center justify-center text-white gap-1">
          <i data-lucide="camera" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium tracking-wide uppercase">Cambiar</span>
        </div>
      </div>

      <h2 class="text-2xl font-bold text-gray-800 tracking-tight" id="profile-name">—</h2>
      <p class="text-sm text-gray-500 font-medium mt-0.5" id="profile-email">—</p>
      <div class="mt-3 inline-block" id="profile-role-badge"></div>
    </div>

    <div class="panel mt-6 rounded-2xl shadow-sm border border-gray-100 bg-white">
      <div class="border-b border-gray-50 p-5">
        <h3 class="font-bold text-gray-800 flex items-center gap-2 text-base">
          <i data-lucide="id-card" class="w-5 h-5 text-accent"></i>
          Información Personal
        </h3>
      </div>
      <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
        <div>
          <p class="form-label-tiny text-gray-400 font-semibold tracking-wider uppercase text-[11px]">Nombre Completo</p>
          <p class="text-sm font-semibold text-gray-700 mt-1" id="info-name">—</p>
        </div>
        <div>
          <p class="form-label-tiny text-gray-400 font-semibold tracking-wider uppercase text-[11px]">DNI</p>
          <p class="text-sm font-semibold text-gray-700 font-mono mt-1" id="info-dni">—</p>
        </div>
        <div>
          <p class="form-label-tiny text-gray-400 font-semibold tracking-wider uppercase text-[11px]">Correo electrónico</p>
          <p class="text-sm font-semibold text-gray-700 mt-1" id="info-email">—</p>
        </div>
        <div>
          <p class="form-label-tiny text-gray-400 font-semibold tracking-wider uppercase text-[11px]">Rol en el sistema</p>
          <p class="text-sm font-semibold text-gray-700 mt-1" id="info-role">—</p>
        </div>
        <div>
          <p class="form-label-tiny text-gray-400 font-semibold tracking-wider uppercase text-[11px]">ID de Usuario</p>
          <p class="text-xs font-mono text-gray-400 mt-1" id="info-id">—</p>
        </div>
        <div>
          <p class="form-label-tiny text-gray-400 font-semibold tracking-wider uppercase text-[11px]">Estado de cuenta</p>
          <p class="text-sm font-semibold text-emerald-600 flex items-center gap-1.5 mt-1">
            <i data-lucide="check-circle" class="w-4 h-4"></i> Activo
          </p>
        </div>
      </div>
    </div>

    <div class="panel mt-6 rounded-2xl shadow-sm border border-gray-100 bg-white">
      <div class="border-b border-gray-50 p-5">
        <h3 class="font-bold text-gray-800 flex items-center gap-2 text-base">
          <i data-lucide="lock" class="w-5 h-5 text-accent"></i>
          Seguridad de la Cuenta
        </h3>
      </div>
      <div class="p-6">
        <button id="btn-change-password" class="btn-page-primary flex items-center gap-2 bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 shadow-none px-4 py-2.5 rounded-xl text-sm font-medium transition-colors">
          <i data-lucide="key" class="w-4 h-4 text-gray-500"></i> Cambiar contraseña
        </button>

        <div id="password-form" class="hidden mt-4 space-y-4 max-w-md border-t border-gray-50 pt-4">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">Contraseña actual</label>
            <input type="password" id="current-pwd" class="input-page w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:border-accent focus:ring-1 focus:ring-accent outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">Nueva contraseña</label>
            <input type="password" id="new-pwd" class="input-page w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:border-accent focus:ring-1 focus:ring-accent outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">Confirmar nueva contraseña</label>
            <input type="password" id="confirm-pwd" class="input-page w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:border-accent focus:ring-1 focus:ring-accent outline-none" />
          </div>
          <div class="flex gap-3 pt-2">
            <button id="btn-save-pwd" class="btn-page-primary bg-accent hover:bg-accent-dark text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm">Guardar Cambios</button>
            <button id="btn-cancel-pwd" class="text-sm font-medium text-gray-500 hover:text-gray-700 px-3 py-2 transition-colors">Cancelar</button>
          </div>
          <div id="pwd-error" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3"></div>
        </div>
      </div>
    </div>

  </main>

  <script src="/src/auth.js"></script>
  <script src="/src/ui.js"></script>
  <script>
    if (!Auth.requireLogin()) throw new Error('No auth');

    QO.navbar({
      active:   '',
      name:     Auth.getUserName(),
      role:     Auth.getReadableRole(),
      menuType: Auth.getMenuType(),
    });
    QO.footer();

    const name = Auth.getUserName();
    const avatarContainer = document.getElementById('profile-avatar-container');
    const avatarInitials = document.getElementById('avatar-initials');
    const avatarImg = document.getElementById('avatar-img');

    // 1. Cargar Fallback del LocalStorage inmediatamente
    document.getElementById('profile-name').textContent = name;
    document.getElementById('profile-email').textContent = Auth.getUserEmail() || '—';
    document.getElementById('profile-role-badge').innerHTML = QO.roleBadge(Auth.getReadableRole());
    
    // Aplicar color dinámico de avatar basado en iniciales
    avatarContainer.className = `w-full h-full rounded-full flex items-center justify-center text-3xl font-bold ${avatarColor(name)} transition-all duration-300`;
    avatarInitials.textContent = initials(name);

    // Si guardaste un avatar previo en localStorage, usarlo de inmediato
    if (localStorage.getItem('userAvatar')) {
      mostrarFoto(localStorage.getItem('userAvatar'));
    }

    document.getElementById('info-name').textContent  = name;
    document.getElementById('info-email').textContent = Auth.getUserEmail() || '—';
    document.getElementById('info-dni').textContent   = Auth.getUserDni()   || '—';
    document.getElementById('info-role').textContent  = Auth.getReadableRole();
    document.getElementById('info-id').textContent    = Auth.getUserId();

    // 2. Refrescar datos reales desde el Servidor
    async function refrescarPerfil() {
      try {
        const res = await fetch(`/api/users/${Auth.getUserId()}`, { credentials: 'include' });
        if (!res.ok) return;
        const u = await res.json();
        
        if (u.email) {
          document.getElementById('info-email').textContent = u.email;
          document.getElementById('profile-email').textContent = u.email;
          localStorage.setItem('userEmail', u.email);
        }
        if (u.dni) {
          document.getElementById('info-dni').textContent = u.dni;
          localStorage.setItem('userDni', u.dni);
        }
        // Supongamos que tu backend devuelve la columna "avatarUrl" o "imageUrl"
        if (u.avatarUrl) {
          mostrarFoto(u.avatarUrl);
          localStorage.setItem('userAvatar', u.avatarUrl);
        }
      } catch {}
    }
    refrescarPerfil();

    function mostrarFoto(url) {
      if (!url) return;
      avatarImg.src = url;
      avatarImg.classList.remove('hidden');
      avatarInitials.classList.add('hidden');
    }

    // 3. Lógica para cambiar la Foto de Perfil
    const avatarOverlay = document.getElementById('avatar-overlay');
    const avatarInput = document.getElementById('avatar-input');

    avatarOverlay.addEventListener('click', () => avatarInput.click());

    avatarInput.addEventListener('change', async () => {
      const file = avatarInput.files[0];
      if (!file) return;

      // Opción A: Mandar el archivo como FormData a un Servlet que acepte multipart
      const formData = new FormData();
      formData.append('avatar', file);

      try {
        // Ajusta esta ruta según crees tu endpoint en el Servlet de Usuarios
        const res = await fetch('/api/users/me/avatar', {
          method: 'POST',
          credentials: 'include',
          body: formData
        });

        if (res.ok) {
          const data = await res.json();
          mostrarFoto(data.avatarUrl);
          localStorage.setItem('userAvatar', data.avatarUrl);
          alert('¡Foto de perfil actualizada con éxito!');
          location.reload();
        } else {
          alert('No se pudo subir la imagen.');
        }
      } catch (err) {
        console.error(err);
        // Fallback visual inmediato por si quieres simularlo localmente en base64 primero:
        const reader = new FileReader();
        reader.onload = (e) => {
          mostrarFoto(e.target.result);
          localStorage.setItem('userAvatar', e.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    // 4. Cambiar contraseña
    document.getElementById('btn-change-password').addEventListener('click', () => {
      document.getElementById('password-form').classList.remove('hidden');
      document.getElementById('btn-change-password').classList.add('hidden');
    });
    document.getElementById('btn-cancel-pwd').addEventListener('click', () => {
      document.getElementById('password-form').classList.add('hidden');
      document.getElementById('btn-change-password').classList.remove('hidden');
    });
    document.getElementById('btn-save-pwd').addEventListener('click', async () => {
      const cur   = document.getElementById('current-pwd').value;
      const nuevo = document.getElementById('new-pwd').value;
      const conf  = document.getElementById('confirm-pwd').value;
      const err   = document.getElementById('pwd-error');
      err.classList.add('hidden');

      if (!cur || !nuevo || !conf) {
        err.textContent = 'Completa todos los campos';
        err.classList.remove('hidden'); return;
      }
      if (nuevo !== conf) {
        err.textContent = 'Las contraseñas no coinciden';
        err.classList.remove('hidden'); return;
      }
      if (nuevo.length < 6) {
        err.textContent = 'La contraseña debe tener al menos 6 caracteres';
        err.classList.remove('hidden'); return;
      }

      try {
        const res = await fetch('/api/users/me/password', {
          method: 'PUT',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current: cur, newPassword: nuevo }),
        });
        if (res.ok) {
          alert('Contraseña actualizada con éxito');
          location.reload();
        } else {
          const d = await res.json().catch(() => ({}));
          err.textContent = d.error || 'No se pudo actualizar';
          err.classList.remove('hidden');
        }
      } catch (e) {
        err.textContent = `Error: ${e.message}`;
        err.classList.remove('hidden');
      }
    });

    // Helpers
    function initials(name) {
      return (name || 'U').split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
    }
    function avatarColor(name) {
      const colors = ['bg-blue-50 text-blue-600 border-blue-100', 'bg-pink-50 text-pink-600 border-pink-100',
                      'bg-emerald-50 text-emerald-600 border-emerald-100', 'bg-yellow-50 text-yellow-600 border-yellow-100'];
      return colors[(name || 'U').charCodeAt(0) % colors.length];
    }

    lucide.createIcons();
  </script>
</body>
</html>

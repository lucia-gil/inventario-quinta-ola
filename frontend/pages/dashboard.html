<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Quinta Ola</title>
  <link href="/src/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-body">

  <!-- ============================================================
       NAVBAR — generada automáticamente por ui.js
       active: qué enlace queda resaltado
  ============================================================ -->

  <main class="page-main">

    <!-- CABECERA -->
    <div>
      <h1 class="page-title">Bienvenido al Sistema de Inventario</h1>
      <p class="page-subtitle">Resumen general de estado y actividad reciente de materiales.</p>
    </div>

    <!-- STAT CARDS — se renderizan desde JS con QO.renderStatCards() -->
    <div id="stats-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Las tarjetas se inyectan aquí automáticamente -->
    </div>

    <!-- TABLA DE ÚLTIMOS MOVIMIENTOS -->
    <div class="panel">
      <div class="panel-header">
        <div>
          <h2 class="panel-header-title">Últimos movimientos</h2>
          <p class="panel-header-sub">Actividad reciente del inventario</p>
        </div>
        <a href="/pages/history.html"
          class="text-sm font-semibold text-accent hover:text-pink-600 transition flex items-center gap-1">
          Ver todo <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </a>
      </div>

      <div class="table-wrapper">
        <table class="table">
          <thead class="table-head">
          <tr>
            <th class="th">ID</th>
            <th class="th">Solicitante</th>
            <th class="th">Material</th>
            <th class="th-center">Cantidad</th>
            <th class="th-center">Tipo</th>
            <th class="th">Fecha</th>
            <th class="th-center">Estado</th>
            <th class="th-center">Detalle</th>
          </tr>
        </thead>
        
          <tbody id="movements-tbody" class="table-body">
            <!-- filas inyectadas por JS -->
          </tbody>
        </table>
      </div>

      <div class="panel-footer">
        <p class="panel-count-text">
          Mostrando <span class="font-medium text-gray-700" id="showing-count">0</span>
          de <span class="font-medium text-gray-700" id="total-count">0</span> movimientos
        </p>
        <div id="dashboard-pagination"></div>
      </div>
    </div>

  </main>

  <!-- FOOTER — generado automáticamente -->
  <script src="/src/auth.js"></script>
  <script src="/src/ui.js"></script>
  <script>
    // ── 1. CONFIGURACIÓN DE IDENTIDAD Y SEGURIDAD POR ROL ──────────────────────────
    // Forzamos que solo entren superadmin, admin y manager (coordinadora)
    if (!Auth.requireRole(['role-superadmin', 'role-admin', 'role-manager'])) {
      throw new Error('No autorizado para ver el panel de control');
    }

    const userName = Auth.getUserName() || 'Usuario';
    const userRole = Auth.getReadableRole() || '';
    const roleId   = Auth.getRoleId();

    // Roles booleanos para control de flujo internos de la página
    const isAdmin   = roleId === 'role-admin' || roleId === 'role-superadmin';
    const isManager = roleId === 'role-manager';
    const isViewer  = roleId === 'role-viewer';

    QO.navbar({ 
      active: 'dashboard', 
      name: userName, 
      role: userRole,
      menuType: Auth.getMenuType() 
    });
    QO.footer();

    // ── 2. CARGAR MÉTRICAS Y MOVIMIENTOS REALES DESDE BACKEND ──────────────────
    async function cargarDashboardReal() {
      try {
        // Consultamos la API de transacciones
        const res = await fetch('/api/transactions', { credentials: 'include' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const transacciones = await res.json();

        // Si es un Solicitante (Viewer), filtramos para que solo vea sus propias solicitudes
        const movimientosFiltrados = isViewer 
          ? transacciones.filter(t => t.requesterId === localStorage.getItem("userId"))
          : transacciones;

        // Calcular métricas basadas en la data real viva
        const totalItems  = window.inventoryData ? window.inventoryData.length : 12; 
        const pendientes  = transacciones.filter(t => t.status === 'PENDING' || t.status === 'Pendiente').length;
        const aprobadas   = transacciones.filter(t => t.status === 'APPROVED' || t.status === 'Aprobada' || t.status === 'COMPLETED').length;
        const bajoStock   = 3; // Valor de contingencia o jalar de tu endpoint de items si aplica

        // Renderizamos las métricas reales
        QO.renderStatCards('stats-grid', [
          { label: 'Total Materiales', value: totalItems,  icon: 'package',        colorClass: 'stat-icon-blue' },
          { label: 'Bajo Stock',       value: bajoStock,   icon: 'alert-triangle', colorClass: 'stat-icon-orange' },
          { label: 'Pendientes',       value: pendientes,  icon: 'clock',          colorClass: 'stat-icon-yellow' },
          { label: 'Aprobadas',        value: aprobadas,   icon: 'check-circle',   colorClass: 'stat-icon-green' },
        ]);

        // Mapeamos los datos al formato exacto que ui.js espera
        const movimientosFormateados = movimientosFiltrados.slice(0, 5).map(t => ({
          id: t.id.length > 12 ? `TXN-${t.id.substring(0, 5).toUpperCase()}` : t.id,
          requester: t.requesterName || 'Sistema',
          item: t.itemName || 'Material',
          qty: `${t.quantity} ${t.itemUnit || 'unid.'}`,
          type: t.type || 'OUT',
          date: new Date(t.createdAt).toLocaleDateString('es-PE'),
          status: t.status === 'PENDING' ? 'Pendiente' : t.status === 'APPROVED' ? 'Aprobado' : t.status === 'REJECTED' ? 'Rechazado' : 'Entregado',
          realId: t.id // Preservamos el ID nativo de la base de datos
        }));

        // Limpiar contenedor e inyectar filas con redirección dinámica nativa
        const tbody = document.getElementById('movements-tbody');
        if (movimientosFormateados.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-gray-400 text-sm">No se registran solicitudes de materiales.</td></tr>`;
        } else {
          tbody.innerHTML = movimientosFormateados.map(m => `
            <tr class="table-row">
              <td class="td font-mono text-xs font-bold">${m.id}</td>
              <td class="td font-medium text-gray-700">${m.requester}</td>
              <td class="td font-semibold">${m.item}</td>
              <td class="td-center">${m.qty}</td>
              <td class="td-center">${QO.typeBadge(m.type)}</td>
              <td class="td-light">${m.date}</td>
              <td class="td-center">${QO.statusBadge(m.status)}</td>
              <td class="td-center">
                <a href="/pages/request-detail.html?id=${m.realId}" class="text-accent hover:text-pink-600 font-bold p-1 transition-colors">
                  <i data-lucide="eye" class="w-4 h-4 inline"></i>
                </a>
              </td>
            </tr>
          `).join('');
        }

        document.getElementById('showing-count').textContent = movimientosFormateados.length;
        document.getElementById('total-count').textContent = movimientosFiltrados.length;

        QO.renderPagination('dashboard-pagination', { 
          current: 1, 
          total: Math.ceil(movimientosFiltrados.length / 5) || 1 
        });

      } catch (err) {
        console.error("Error poblando Dashboard:", err);
        // Fallback preventivo por si el backend se encuentra offline durante pruebas
        QO.renderStatCards('stats-grid', [
          { label: 'Total Materiales', value: 0, icon: 'package', colorClass: 'stat-icon-blue' },
          { label: 'Bajo Stock', value: 0, icon: 'alert-triangle', colorClass: 'stat-icon-orange' },
          { label: 'Pendientes', value: 0, icon: 'clock', colorClass: 'stat-icon-yellow' },
          { label: 'Aprobadas', value: 0, icon: 'check-circle', colorClass: 'stat-icon-green' },
        ]);
      }
      if (window.lucide) lucide.createIcons();
    }

    // Arrancar la carga asíncrona
    cargarDashboardReal();
  </script>
</body>
</html>

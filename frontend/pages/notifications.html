<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notificaciones | Quinta Ola</title>
  <link href="/src/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-body">

  <main class="page-main-narrow">

    <div class="page-header">
      <div>
        <h1 class="page-title">Notificaciones</h1>
        <p class="page-subtitle" id="notif-subtitle">Cargando...</p>
      </div>
      <button id="btn-mark-all" class="btn-ghost">
        <i data-lucide="check-check" class="w-4 h-4"></i> Marcar todas como leídas
      </button>
    </div>

    <div class="panel" id="notif-container">
      <div id="notif-list" class="divide-y divide-gray-100">
        <p class="text-center text-gray-400 py-12">Cargando notificaciones...</p>
      </div>
    </div>

  </main>

  <script src="/src/auth.js"></script>
  <script src="/src/ui.js"></script>
  <script>
    if (!Auth.requireLogin()) throw new Error('No auth');

    // SuperAdmin no tiene notificaciones (lo dice el PDF)
    if (!Auth.canSeeNotifications()) {
      window.location.href = '/pages/403.html';
    }

    QO.navbar({
      active:   '',
      name:     Auth.getUserName(),
      role:     Auth.getReadableRole(),
      menuType: Auth.getMenuType(),
    });
    QO.footer();

    const TYPE_META = {
      'request_approved':   { icon: 'check-circle', color: 'text-green-600 bg-green-50' },
      'request_rejected':   { icon: 'x-circle',     color: 'text-red-600 bg-red-50' },
      'new_request':        { icon: 'inbox',        color: 'text-blue-600 bg-blue-50' },
      'ready_for_delivery': { icon: 'package',      color: 'text-amber-600 bg-amber-50' },
    };

    async function cargar() {
      try {
        const notifs = await Auth.fetchNotifications();
        const unread = notifs.filter(n => !n.isRead && !n.is_read).length;
        document.getElementById('notif-subtitle').textContent =
          `${notifs.length} total · ${unread} sin leer`;

        if (notifs.length === 0) {
          document.getElementById('notif-list').innerHTML = `
            <div class="text-center py-16 text-gray-400">
              <i data-lucide="bell-off" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
              <p class="text-sm">No tienes notificaciones</p>
            </div>`;
          lucide.createIcons();
          return;
        }

        document.getElementById('notif-list').innerHTML = notifs.map(n => {
          const meta = TYPE_META[n.type] || { icon: 'bell', color: 'text-gray-600 bg-gray-50' };
          const isUnread = !n.isRead && !n.is_read;
          return `
            <div class="flex gap-4 p-5 hover:bg-gray-50 ${isUnread ? 'bg-blue-50/30' : ''}">
              <div class="w-10 h-10 rounded-full ${meta.color} flex items-center justify-center flex-shrink-0">
                <i data-lucide="${meta.icon}" class="w-5 h-5"></i>
              </div>
              <div class="flex-1">
                <div class="flex justify-between items-start mb-1">
                  <h3 class="font-bold text-gray-800 text-sm">${n.title}</h3>
                  <span class="text-[10px] text-gray-400 whitespace-nowrap">${n.createdAt || n.created_at || ''}</span>
                </div>
                <p class="text-sm text-gray-600 leading-relaxed">${n.message || ''}</p>
                ${n.relatedId || n.related_id ? `
                  <a href="/pages/request-detail.html?id=${n.relatedId || n.related_id}"
                     class="inline-flex items-center gap-1 text-xs font-semibold text-accent hover:underline mt-2">
                    Ver detalle <i data-lucide="arrow-right" class="w-3 h-3"></i>
                  </a>` : ''}
              </div>
              ${isUnread ? '<span class="w-2 h-2 rounded-full bg-blue-500 flex-shrink-0 mt-2"></span>' : ''}
            </div>`;
        }).join('');
        lucide.createIcons();
      } catch (err) {
        document.getElementById('notif-list').innerHTML =
          `<p class="text-center text-red-500 py-12">Error: ${err.message}</p>`;
      }
    }

    document.getElementById('btn-mark-all').addEventListener('click', async () => {
      try {
        await fetch('/api/notifications/read-all', {
          method: 'PUT', credentials: 'include',
        });
        cargar();
      } catch (err) {
        alert('No se pudo: ' + err.message);
      }
    });

    cargar();
  </script>
</body>
</html>

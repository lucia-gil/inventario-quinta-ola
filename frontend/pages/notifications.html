<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notificaciones | Quinta Ola</title>
  <link href="/src/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-body">

  <main class="page-main-narrow">

    <div class="page-header">
      <div>
        <h1 class="page-title">Notificaciones</h1>
        <p class="page-subtitle" id="notif-subtitle">Cargando...</p>
      </div>
      <button id="btn-mark-all" class="btn-ghost">
        <i data-lucide="check-check" class="w-4 h-4"></i> Marcar todas como leídas
      </button>
    </div>

    <div class="panel" id="notif-container">
      <div id="notif-list" class="divide-y divide-gray-100">
        <p class="text-center text-gray-400 py-12">Cargando notificaciones...</p>
      </div>
    </div>

  </main>

  <script src="/src/auth.js"></script>
  <script src="/src/ui.js"></script>
  <script>
    if (!Auth.requireLogin()) throw new Error('No auth');

    if (!Auth.canSeeNotifications()) {
      window.location.href = '/pages/403.html';
    }

    QO.navbar({
      active:   '',
      name:     Auth.getUserName(),
      role:     Auth.getReadableRole(),
      menuType: Auth.getMenuType(),
    });
    QO.footer();

    const TYPE_META = {
      'request_approved':   { icon: 'check-circle', color: 'text-green-600 bg-green-50' },
      'request_rejected':   { icon: 'x-circle',     color: 'text-red-600 bg-red-50' },
      'new_request':        { icon: 'inbox',        color: 'text-blue-600 bg-blue-50' },
      'ready_for_delivery': { icon: 'package',      color: 'text-amber-600 bg-amber-50' },
      'PENDING':            { icon: 'clock',        color: 'text-pink-600 bg-pink-50' },
      'APPROVED':           { icon: 'check-circle', color: 'text-green-600 bg-green-50' }
    };

    async function cargar() {
      const listaContainer = document.getElementById('notif-list');
      if (!listaContainer) return;

      try {
        // Consumimos las notificaciones reales del backend 200 OK
        const notifs = await Auth.fetchNotifications();
        
        // Mapeo seguro adaptado a las variables exactas del modelo de Java (isRead y createdAt)
        const unread = notifs.filter(n => {
          const leido = (n.isRead !== undefined) ? n.isRead : n.is_read;
          return leido === 0 || leido === false;
        }).length;
        
        const subtitleEl = document.getElementById('notif-subtitle');
        if (subtitleEl) {
          subtitleEl.textContent = `${notifs.length} total · ${unread} sin leer`;
        }

        if (!notifs || notifs.length === 0) {
          listaContainer.innerHTML = `
            <div class="text-center py-16 text-gray-400">
              <i data-lucide="bell-off" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
              <p class="text-sm">No tienes notificaciones</p>
            </div>`;
          if (window.lucide) lucide.createIcons();
          return;
        }

        listaContainer.innerHTML = notifs.map(n => {
          const meta = TYPE_META[n.type] || { icon: 'bell', color: 'text-pink-600 bg-pink-50' };
          const leidoVal = (n.isRead !== undefined) ? n.isRead : n.is_read;
          const isUnread = leidoVal === 0 || leidoVal === false;
          
          // Formateador de fechas robusto para strings directos de Java
          let fechaFormateada = 'Reciente';
          let fechaRaw = n.createdAt || n.created_at;
          
          if (fechaRaw) {
            if (typeof fechaRaw === 'string' && !fechaRaw.includes('T')) {
              fechaRaw = fechaRaw.replace(' ', 'T');
            }
            const fechaObj = new Date(fechaRaw);
            if (!isNaN(fechaObj.getTime())) {
              fechaFormateada = fechaObj.toLocaleString('es-PE', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              });
            } else {
              fechaFormateada = String(fechaRaw).split('.')[0]; 
            }
          }

          return `
            <div class="flex gap-4 p-5 hover:bg-gray-50/80 transition-colors ${isUnread ? 'bg-pink-50/10' : ''}">
              <div class="w-10 h-10 rounded-xl ${meta.color} flex items-center justify-center flex-shrink-0">
                <i data-lucide="${meta.icon}" class="w-5 h-5"></i>
              </div>
              <div class="flex-1">
                <div class="flex justify-between items-start mb-1 gap-4">
                  <h3 class="font-bold text-gray-800 text-sm flex items-center gap-1.5">
                    ${n.title || 'Nueva Alerta'}
                    ${isUnread ? '<span class="w-2 h-2 rounded-full bg-pink-500 inline-block"></span>' : ''}
                  </h3>
                  <span class="text-[11px] text-gray-400 font-medium whitespace-nowrap">${fechaFormateada}</span>
                </div>
                <p class="text-sm text-gray-600 leading-relaxed">${n.message || n.content || ''}</p>
                ${n.relatedId || n.related_id ? `
                  <a href="/pages/request-detail.html?id=${n.relatedId || n.related_id}"
                     class="inline-flex items-center gap-1 text-xs font-semibold text-accent hover:underline mt-2">
                    Ver detalle <i data-lucide="arrow-right" class="w-3 h-3"></i>
                  </a>` : ''}
              </div>
            </div>`;
        }).join('');
        
        if (window.lucide) lucide.createIcons();
      } catch (err) {
        console.error("Error cargando el listado:", err);
        listaContainer.innerHTML =
          `<p class="text-center text-red-500 py-12 font-medium">Error al procesar las alertas: ${err.message}</p>`;
      }
    }

    const btnMarkAll = document.getElementById('btn-mark-all');
    if (btnMarkAll) {
      btnMarkAll.addEventListener('click', async () => {
        try {
          await fetch('/api/notifications/read-all', {
            method: 'PUT', credentials: 'include',
          });
          cargar();
        } catch (err) {
          alert('No se pudo marcar como leídas: ' + err.message);
        }
      });
    }

    cargar();
  </script>
</body>
</html>

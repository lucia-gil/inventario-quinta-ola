<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario | Quinta Ola</title>
  <link href="/src/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-body">

  <main class="page-main">

    <div class="page-header">
      <div>
        <h1 class="page-title">Lista de Materiales</h1>
        <p class="page-subtitle">Listado de materiales y stock actual en tiempo real.</p>
      </div>
      <!-- Solo admin/superadmin pueden añadir material -->
      <a href="/pages/admin-items.html"
         data-requires="canManageItems"
         class="btn-page-primary">
        <i data-lucide="plus" class="w-4 h-4"></i> Añadir Material
      </a>
    </div>

    <div class="search-bar">
      <div class="search-input-wrap">
        <i data-lucide="search" class="input-icon-left"></i>
        <input type="text" id="search-input" placeholder="Buscar materiales..." class="input-icon" />
      </div>
      <div class="flex gap-3">
        <select id="filter-tag" class="select-page w-auto">
          <option value="">Todas las Etiquetas</option>
          <option>Construcción</option>
          <option>Acabados</option>
          <option>Líquidos</option>
          <option>Plomería</option>
        </select>
        <select id="filter-stock" class="select-page w-auto">
          <option value="">Todos los Stocks</option>
          <option value="OK">OK (En Stock)</option>
          <option value="Stock Bajo">Bajo Stock</option>
          <option value="Sin Stock">Sin Stock</option>
        </select>
      </div>
    </div>

    <div class="table-panel">
      <div class="table-wrapper">
        <table class="table">
          <thead class="table-head">
            <tr>
              <th class="th">Material</th>
              <th class="th">Tags</th>
              <th class="th">Stock</th>
              <th class="th">Mínimo</th>
              <th class="th">Estado</th>
            </tr>
          </thead>
          <tbody id="inventory-tbody" class="table-body"></tbody>
        </table>
      </div>

      <div class="panel-footer">
        <p class="panel-count-text" id="inventory-count">Cargando ítems...</p>
        <div id="inventory-pagination"></div>
      </div>
    </div>

  </main>

  <script src="/src/auth.js"></script>
  <script src="/src/ui.js"></script>
  <script>
    // 1. GUARDIA — sesión obligatoria
    if (!Auth.requireLogin()) throw new Error('No auth');

    // 2. NAVBAR derivada del rol
    QO.navbar({
      active:   'inventory',
      name:     Auth.getUserName(),
      role:     Auth.getReadableRole(),
      menuType: Auth.getMenuType(),
    });
    QO.footer();

    // 3. CARGAR INVENTARIO — sin lógica de rol aquí, el atributo data-requires
    //    en el botón ya lo oculta automáticamente vía auth.js
    async function cargarInventario() {
      try {
        const res = await fetch('/api/items', { credentials: 'include' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const items = await res.json();

        const inventario = items.map(item => ({
          img:    item.imageUrl || '/img/placeholder.png',
          name:   item.name,
          tags:   item.category ? [item.category] : [],
          stock:  item.cachedQuantity,
          unit:   item.unit || 'unid.',
          min:    item.minQuantity,
          status: item.status || 'OK',
        }));

        QO.renderInventoryRows('inventory-tbody', inventario);

        document.getElementById('inventory-count').textContent =
          `Mostrando ${inventario.length} de ${inventario.length} items`;

        QO.renderPagination('inventory-pagination', {
          current: 1,
          total:   Math.ceil(inventario.length / 5) || 1,
        });

      } catch (err) {
        console.error('Error cargando inventario:', err);
        document.getElementById('inventory-count').textContent =
          `Error: ${err.message}`;
      }
      lucide.createIcons();
    }

    cargarInventario();
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario | Quinta Ola</title>

  <link href="/src/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-body">

  <main class="page-main">

    <div class="page-header">
      <div>
        <h1 class="page-title" id="inventory-title">
          Lista de Materiales
        </h1>

        <p class="page-subtitle" id="inventory-subtitle">
          Listado de materiales y stock actual en tiempo real.
        </p>
      </div>

      <a href="/pages/admin-items.html"
         class="btn-page-primary"
         id="btn-add-material">

        <i data-lucide="plus" class="w-4 h-4"></i>
        Añadir Material
      </a>
    </div>

    <div class="search-bar">

      <div class="search-input-wrap">
        <i data-lucide="search" class="input-icon-left"></i>

        <input
          type="text"
          id="search-input"
          placeholder="Buscar materiales..."
          class="input-icon"
        />
      </div>

      <div class="flex gap-3" id="filters-admin">

        <select id="filter-tag" class="select-page w-auto">
          <option value="">Todas las Etiquetas</option>
          <option value="Construcción">Construcción</option>
          <option value="Acabados">Acabados</option>
          <option value="Líquidos">Líquidos</option>
          <option value="Plomería">Plomería</option>
        </select>

        <select id="filter-stock" class="select-page w-auto">
          <option value="">Todos los Stocks</option>
          <option value="OK">OK (En Stock)</option>
          <option value="Stock Bajo">Bajo Stock</option>
          <option value="Sin Stock">Sin Stock</option>
        </select>

      </div>
    </div>

    <div id="viewer-catalog-view" class="hidden">

      <div
        id="catalog-container"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
      >
        </div>

      <div class="panel-footer mt-8">
        <p class="panel-count-text" id="catalog-count">
          Cargando materiales...
        </p>

        <div id="catalog-pagination"></div>
      </div>

    </div>

    <div id="inventory-table-view">

      <div class="table-panel">

        <div class="table-wrapper">

          <table class="table">

            <thead class="table-head">
              <tr>
                <th class="th">Material</th>
                <th class="th">Tags</th>
                <th class="th">Stock</th>
                <th class="th">Mínimo</th>
                <th class="th">Estado</th>
                <th class="th th-action-crud text-center !text-center" style="text-align: center !important; width: 180px;">Acciones</th>
              </tr>
            </thead>

            <tbody
              id="inventory-tbody"
              class="table-body"
            ></tbody>

          </table>

        </div>

        <div class="panel-footer">

          <p
            class="panel-count-text"
            id="inventory-count"
          >
            Cargando ítems...
          </p>

          <div id="inventory-pagination"></div>

        </div>

      </div>

    </div>

  </main>

  <div id="item-modal"
       class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

    <div class="bg-white rounded-2xl p-6 w-full max-w-xl relative">

      <button
        onclick="QO.closeItemModal()"
        class="absolute top-4 right-4 text-xl">
        ✕
      </button>

      <div id="item-modal-content"></div>

    </div>

  </div>

  <script src="/src/auth.js"></script>
  <script src="/src/ui.js"></script>

  <script>

    // =====================================================
    // GUARDIA
    // =====================================================

    if (!Auth.requireLogin()) {
      throw new Error('No auth');
    }

    // =====================================================
    // DATOS DE SESIÓN
    // =====================================================

    const roleId = parseInt(Auth.getRoleId(), 10) || 0;
    
    // Viewers (1) y Members (2) usan la vista de catálogo visual
    const isViewer = roleId === 1 || roleId === 2; 
    
    // Manager (3), Admin (4) y SuperAdmin (5) usan la vista de tabla administrativa
    const isManager = roleId === 3;
    const isAdmin = roleId === 4 || roleId === 5;

    // =====================================================
    // NAVBAR
    // =====================================================

    QO.navbar({
      active: 'inventory',
      name: Auth.getUserName(),
      role: Auth.getReadableRole(),
      roleId: roleId
    });

    QO.footer();

    // =====================================================
    // CONFIGURAR UI SEGÚN ROL
    // =====================================================
    function configureInventoryByRole() {
      const tableView = document.getElementById('inventory-table-view');
      const catalogView = document.getElementById('viewer-catalog-view');
      const filtersAdmin = document.getElementById('filters-admin');
      const title = document.getElementById('inventory-title');
      const subtitle = document.getElementById('inventory-subtitle');
      
      // Capturamos el botón de añadir material
      const btnAddMaterial = document.getElementById('btn-add-material');

      if (isViewer) {
        catalogView.classList.remove('hidden');
        tableView.classList.add('hidden');
        title.textContent = 'Catálogo de Materiales';
        subtitle.textContent = 'Selecciona materiales y agrégalos a tu solicitud.';
        
        // Si es Viewer (Solicitante), ocultamos el botón obligatoriamente
        if (btnAddMaterial) btnAddMaterial.classList.add('hidden');
      } else {
        // Entra aquí si es Admin, SuperAdmin o Manager (María Aprobadora)
        catalogView.classList.add('hidden');
        tableView.classList.remove('hidden');
        
        // ACTIVACIÓN COMPLETA PARA EL MANAGER:
        // Si el usuario es Administrador o es Manager (Coordinadora), forzamos la aparición del botón
        if (btnAddMaterial) {
          btnAddMaterial.classList.remove('hidden');
          btnAddMaterial.style.setProperty('display', 'inline-flex', 'important'); // Asegura que Tailwind no lo pise
        }
      }
    }

    // =====================================================
    // RENDERIZAR VISTAS (TABLA O CARDS)
    // =====================================================
    function renderizarData(listaItems) {
      if (isViewer) {
        QO.renderCatalogCards('catalog-container', listaItems);
        document.getElementById('catalog-count').textContent = `Mostrando ${listaItems.length} materiales disponibles`;
        
        // Asignar eventos de solicitud directa a los botones de las cards
        const cards = document.querySelectorAll("#catalog-container > div");
        cards.forEach((card, index) => {
          if (listaItems[index]) {
            const item = listaItems[index];
            const botonCard = card.querySelector("button");
            if (botonCard) {
              botonCard.setAttribute("onclick", `QO.addToCart('${item.id}')`);
            }
          }
        });

        QO.renderPagination('catalog-pagination', {
          current: 1,
          total: Math.ceil(listaItems.length / 8) || 1,
        });
      } else {
        QO.renderInventoryRows('inventory-tbody', listaItems);
        document.getElementById('inventory-count').textContent = `Mostrando ${listaItems.length} de ${window.inventoryData.length} items`;

        // Inyectar columnas de acción centradas y botones estilizados
        const filas = document.querySelectorAll("#inventory-tbody tr");
        filas.forEach((fila, index) => {
          if (listaItems[index]) {
            const item = listaItems[index];
            let celdaAccion = fila.querySelector(".td-action-crud");
            if (!celdaAccion) {
              celdaAccion = document.createElement("td");
              fila.appendChild(celdaAccion);
            }
            // Mantenemos la simetría con text-center y justify-center
            celdaAccion.className = "px-4 py-3 text-center td-action-crud flex justify-center gap-2 items-center";
            celdaAccion.innerHTML = `
              <a href="/pages/admin-items.html?id=${item.id}" class="border border-gray-200 hover:border-purple-200 hover:bg-purple-50 text-gray-600 hover:text-purple-700 px-3 py-1.5 rounded-xl text-xs font-medium transition-all flex items-center gap-1.5 shadow-sm">
                <i data-lucide="edit" class="w-3.5 h-3.5"></i>
                <span>Editar</span>
              </a>
              <button onclick="eliminarLogicoMaterial('${item.id}')" class="border border-red-200 hover:bg-red-50 text-red-600 hover:text-red-700 px-3 py-1.5 rounded-xl text-xs font-medium transition-all flex items-center gap-1.5 shadow-sm">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                <span>Desactivar</span>
              </button>
            `;
          }
        });

        QO.renderPagination('inventory-pagination', {
          current: 1,
          total: Math.ceil(listaItems.length / 5) || 1,
        });
      }
      if (window.lucide) lucide.createIcons();
    }

    // =====================================================
    // FILTRADO EN TIEMPO REAL (TEXTO + TAGS + STOCK)
    // =====================================================
    function filtrarInventario() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const tagSeleccionado = document.getElementById('filter-tag').value;
      const stockSeleccionado = document.getElementById('filter-stock').value;

      if (!window.inventoryData) return;

      const resultadoFiltrado = window.inventoryData.filter(item => {
        const matchesTexto = item.name.toLowerCase().includes(query) || item.sku.toLowerCase().includes(query);
        const matchesTag = !tagSeleccionado || item.tags.includes(tagSeleccionado);
        const matchesStock = !stockSeleccionado || item.status === stockSeleccionado;

        return matchesTexto && matchesTag && matchesStock;
      });

      renderizarData(resultadoFiltrado);
    }

    // LISTENERS DE BÚSQUEDA Y FILTROS
    document.getElementById('search-input').addEventListener('input', filtrarInventario);
    document.getElementById('filter-tag').addEventListener('change', filtrarInventario);
    document.getElementById('filter-stock').addEventListener('change', filtrarInventario);

    // =====================================================
    // CARGAR INVENTARIO DESDE LA API
    // =====================================================

    async function cargarInventario() {
      try {
        const res = await fetch('/api/items', { credentials: 'include' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const items = await res.json();

        const inventario = items.map(item => {
            // 🌟 Asegurar que siempre tengamos un arreglo de tags de forma segura
            let listaTagsOriginal = [];
            if (Array.isArray(item.tags)) {
                listaTagsOriginal = item.tags;
            } else if (item.category) {
                listaTagsOriginal = [item.category];
            }

            return {
                id: item.id,
                img: item.imageUrl || '/img/placeholder.png',
                name: item.name,
                sku: item.sku || 'N/A',
                
                // 🌟 CORRECCIÓN CRÍTICA: Ahora lee el arreglo de tags real del backend
                tags: listaTagsOriginal, 
                
                stock: item.cachedQuantity,
                unit: item.unit || 'unid.',
                min: item.minQuantity,
                status: item.status || 'OK',
            };
        });

          window.inventoryData = inventario;
          renderizarData(inventario);

      } catch (err) {
        console.error('Error cargando inventario:', err);
        const errorMessage = `Error: ${err.message}`;
        if (isViewer) {
          document.getElementById('catalog-count').textContent = errorMessage;
        } else {
          document.getElementById('inventory-count').textContent = errorMessage;
        }
      }
    }

    // =====================================================
    // CARRITO / DETALLES — VIEWER
    // =====================================================

    QO.addToCart = function(itemId) {
      if (!isViewer) return;
      window.location.href = `/pages/show-requestform.html?item=${itemId}`;
    };

    QO.showItemDetails = function(itemId) {
      const item = window.inventoryData.find(i => i.id === itemId);
      if (!item) return;

      const modal = document.getElementById('item-modal');
      const content = document.getElementById('item-modal-content');

      content.innerHTML = `
        <img src="${item.img}" class="w-full h-64 object-cover rounded-xl mb-4">
        <h2 class="text-2xl font-bold mb-2">${item.name}</h2>
        <p class="text-gray-500 mb-3">SKU: ${item.sku}</p>
        <div class="space-y-2 mb-4">
          <p><strong>Stock:</strong> ${item.stock} ${item.unit}</p>
          <p><strong>Stock mínimo:</strong> ${item.min}</p>
          <p><strong>Estado:</strong> ${item.status}</p>
        </div>
        <button onclick="QO.addToCart('${item.id}')" class="btn-page-primary w-full">
          Solicitar Material
        </button>
      `;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    };

    QO.closeItemModal = function() {
      const modal = document.getElementById('item-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    // =====================================================
    // ACCIONES CRUD (CONEXIÓN A SERVLETS)
    // =====================================================

    async function eliminarLogicoMaterial(itemId) {
        if (!confirm("¿Está segura de que desea realizar la desactivación lógica de este material?")) return;

        try {
            const res = await fetch(`/api/items/${itemId}/disable`, {
                method: "PUT",
                credentials: "include"
            });

            if (res.ok) {
                alert("¡Material desactivado con éxito! Ha sido removido del catálogo activo.");
                cargarInventario();
            } else {
                const errData = await res.json().catch(() => ({}));
                alert(`Error al desactivar: ${errData.error || 'No autorizado o error interno'}`);
            }
        } catch (error) {
            console.error("Error en disable fetch:", error);
            alert("No se pudo conectar con el servidor.");
        }
    }

    async function iniciarSolicitudDirecta(itemId, itemName) {
        const cantidad = prompt(`¿Cuántas unidades de "${itemName}" requiere solicitar?`);
        if (!cantidad || isNaN(cantidad) || parseInt(cantidad) <= 0) {
            alert("Por favor, ingrese una cantidad numérica válida superior a cero.");
            return;
        }

        const notas = prompt("Ingrese una breve justificación o destino para el material:") || "";
        const userId = localStorage.getItem("userId");

        const solicitudPayload = {
            itemId: itemId,
            requesterId: userId,
            quantity: parseInt(cantidad),
            notes: notas
        };

        try {
            const res = await fetch("/api/transactions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify(solicitudPayload)
            });

            if (res.ok) {
                alert("¡Su solicitud ha sido registrada con éxito y enviada al pool de pendientes del Administrador!");
            } else {
                const errData = await res.json().catch(() => ({}));
                alert(`No se pudo procesar el pedido: ${errData.error || 'Error desconocido'}`);
            }
        } catch (error) {
            console.error("Error en POST transaction:", error);
            alert("Error de red al procesar la solicitud.");
        }
    }

    // =====================================================
    // INIT
    // =====================================================
    configureInventoryByRole();
    cargarInventario();

  </script>

</body>
</html>

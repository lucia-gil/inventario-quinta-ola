<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transacciones | Quinta Ola</title>
    <link href="/src/style.css" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-body">

    <main class="page-main">

        <div class="flex justify-between items-center flex-wrap gap-3">
            <div>
                <h1 class="page-title" id="page-title">Transacciones</h1>
                <p class="page-subtitle" id="page-subtitle">Solicitudes de entrada y salida de stock</p>
            </div>
            <!-- Solo Solicitante/Manager/Admin pueden crear solicitudes (SuperAdmin no) -->
            <a href="/pages/show-requestform.html"
               data-requires="canCreateRequest"
               class="btn-page-primary">
                <i data-lucide="arrow-right-left" class="w-4 h-4"></i> Nueva Transacción
            </a>
        </div>

        <div class="table-panel">
            <div class="table-wrapper">
                <table class="table">
                    <thead class="table-head">
                        <tr>
                            <th class="th">ID</th>
                            <th class="th">Solicitante</th>
                            <th class="th">Item</th>
                            <th class="th">Cantidad</th>
                            <th class="th-center">Tipo</th>
                            <th class="th">Fecha</th>
                            <th class="th-center">Estado</th>
                            <th class="th-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-tbody" class="table-body"></tbody>
                </table>
            </div>

            <div class="panel-footer">
                <p class="panel-count-text" id="transactions-count">Cargando transacciones...</p>
                <div id="transactions-pagination"></div>
            </div>
        </div>
    </main>

    <script src="/src/auth.js"></script>
    <script src="/src/ui.js"></script>
    <script>
        // 1. GUARDIA — sesión obligatoria
        if (!Auth.requireLogin()) throw new Error('No auth');

        // 2. NAVBAR derivada del rol
        QO.navbar({
            active:   'transactions',
            name:     Auth.getUserName(),
            role:     Auth.getReadableRole(),
            menuType: Auth.getMenuType(),
        });
        QO.footer();

        // 3. TÍTULO Y SUBTÍTULO contextuales según el rol
        if (Auth.isViewer()) {
            document.getElementById('page-title').textContent = 'Mis Solicitudes';
            document.getElementById('page-subtitle').textContent = 'Todas las solicitudes que has creado';
        } else if (Auth.canApprove()) {
            document.getElementById('page-title').textContent = 'Solicitudes';
            document.getElementById('page-subtitle').textContent = 'Solicitudes activas del sistema (puedes aprobar/rechazar)';
        } else if (Auth.canDeliver()) {
            document.getElementById('page-title').textContent = 'Solicitudes aprobadas';
            document.getElementById('page-subtitle').textContent = 'Listas para entregar desde el depósito';
        }

        // 4. ENDPOINT según rol
        //    - Viewer: solo las suyas (/me)
        //    - Resto: todas (/)
        async function cargarTransacciones() {
            try {
                const endpoint = Auth.isViewer() ? '/api/transactions/me' : '/api/transactions';

                const res = await fetch(endpoint, { credentials: 'include' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const lista = await res.json();

                // Mapear modelo Java -> formato esperado por ui.js
                const datos = lista.map(txn => {
                    const idFull = txn.id || '';
                    return {
                        id:        idFull.length > 12
                                     ? `TXN-${idFull.substring(0, 8).toUpperCase()}`
                                     : idFull,
                        fullId:    idFull,  // para los links
                        requester: txn.requesterName || 'Usuario',
                        item:      txn.itemName || '—',
                        qty:       `${txn.quantity || 0} ${txn.itemUnit || ''}`,
                        type:      txn.type || 'OUT',
                        date:      txn.createdAt || '',
                        status:    normalizeStatus(txn.status),
                    };
                });

                QO.renderTransactionRows('transactions-tbody', datos);

                document.getElementById('transactions-count').textContent =
                    `Mostrando ${datos.length} registro(s)`;

                QO.renderPagination('transactions-pagination', {
                    current: 1,
                    total:   Math.ceil(datos.length / 10) || 1,
                });

            } catch (error) {
                console.error("Error cargando transacciones:", error);
                document.getElementById('transactions-count').textContent =
                    `Error: ${error.message}`;
            }
            lucide.createIcons();
        }

        // Normaliza el estado por si el backend devuelve inglés
        function normalizeStatus(s) {
            const map = {
                'PENDING':'Pendiente', 'APPROVED':'Aprobada',
                'REJECTED':'Rechazada','COMPLETED':'Entregada',
                'Pendiente':'Pendiente','Aprobada':'Aprobada',
                'Rechazada':'Rechazada','Entregada':'Entregada',
            };
            return map[s] || s || 'Pendiente';
        }

        cargarTransacciones();
    </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio | Quinta Ola</title>
  <link href="/src/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-body">

  <main class="page-main">

    <!-- BANNER DE BIENVENIDA — texto dinámico según rol -->
    <div class="panel-form flex flex-col md:flex-row md:items-center md:justify-between gap-6">
      <div>
        <h2 class="page-title mb-2" id="welcome-title">¡Bienvenida!</h2>
        <p class="text-gray-500 text-base max-w-2xl" id="welcome-subtitle">Cargando...</p>
      </div>
      <div class="flex flex-col sm:flex-row gap-3" id="welcome-actions">
        <!-- Botones dinámicos -->
      </div>
    </div>

    <!-- STAT CARDS — distintos por rol -->
    <div id="home-stats" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

    <!-- ACCESOS RÁPIDOS — distintos por rol -->
    <div>
      <h3 class="text-lg font-bold text-secondary mb-4">Accesos Rápidos</h3>
      <div id="quick-access" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </div>

    <!-- ACTIVIDAD RECIENTE (solo si tiene sentido para el rol) -->
    <div class="panel" id="recent-panel" style="display:none">
      <div class="panel-header">
        <h2 class="panel-header-title" id="recent-title">Actividad reciente</h2>
        <a href="/pages/history.html" class="text-sm font-semibold text-accent hover:text-pink-600 transition flex items-center gap-1">
          Ver todo <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </a>
      </div>
      <div class="table-wrapper">
        <table class="table">
          <thead class="table-head">
            <tr>
              <th class="th">ID</th>
              <th class="th">Solicitante</th>
              <th class="th">Material</th>
              <th class="th-center">Cantidad</th>
              <th class="th-center">Tipo</th>
              <th class="th">Fecha</th>
              <th class="th-center">Estado</th>
              <th class="th-center">Detalle</th>
            </tr>
          </thead>
          <tbody id="recent-tbody" class="table-body"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="/src/auth.js"></script>
  <script src="/src/ui.js"></script>
  <script>
    if (!Auth.requireLogin()) throw new Error('No auth');

    QO.navbar({
      active:   'home',
      name:     Auth.getUserName(),
      role:     Auth.getReadableRole(),
      menuType: Auth.getMenuType(),
    });
    QO.footer();

    /* ============================================================
       VISTA POR ROL — cada rol ve un home distinto
    ============================================================ */
    const userName = Auth.getUserName().split(' ')[0]; // solo el primer nombre

    // === VIEWER (Solicitante) ===
    if (Auth.isViewer()) {
      document.getElementById('welcome-title').textContent = `¡Hola, ${userName}!`;
      document.getElementById('welcome-subtitle').textContent =
        'Aquí puedes solicitar materiales y ver el estado de tus pedidos.';
      document.getElementById('welcome-actions').innerHTML = `
        <a href="/pages/show-requestform.html" class="btn-page-primary">
          <i data-lucide="plus-circle" class="w-4 h-4 mr-1"></i> Nueva Solicitud
        </a>
        <a href="/pages/transactions.html" class="btn-ghost">
          <i data-lucide="list" class="w-4 h-4 mr-1"></i> Mis Solicitudes
        </a>`;

      renderViewerStats();
      renderQuickAccess([
        { icon: 'plus-circle', title: 'Nueva Solicitud',  desc: 'Pedir un material', href: '/pages/show-requestform.html' },
        { icon: 'clipboard-list', title: 'Mis Solicitudes', desc: 'Ver estado de pedidos', href: '/pages/transactions.html' },
        { icon: 'package',     title: 'Catálogo',         desc: 'Ver materiales disponibles', href: '/pages/inventory.html' },
        { icon: 'user-cog',    title: 'Mi Perfil',        desc: 'Editar mis datos',  href: '/pages/profile.html' },
      ]);
    }
    // === MANAGER (Aprobador) ===
    else if (Auth.isManager()) {
      document.getElementById('welcome-title').textContent = `¡Hola, ${userName}!`;
      document.getElementById('welcome-subtitle').textContent =
        'Revisa las solicitudes pendientes de aprobación.';
      document.getElementById('welcome-actions').innerHTML = `
        <a href="/pages/transactions.html" class="btn-page-primary">
          <i data-lucide="inbox" class="w-4 h-4 mr-1"></i> Ver pendientes
        </a>`;

      renderManagerStats();
      renderQuickAccess([
        { icon: 'inbox',        title: 'Por Aprobar',  desc: 'Solicitudes pendientes', href: '/pages/transactions.html' },
        { icon: 'package',      title: 'Inventario',   desc: 'Ver stock actual',  href: '/pages/inventory.html' },
        { icon: 'clipboard-list', title: 'Historial',  desc: 'Solicitudes pasadas', href: '/pages/history.html' },
        { icon: 'user-cog',     title: 'Mi Perfil',    desc: 'Mis datos',  href: '/pages/profile.html' },
      ]);
      mostrarRecientes();
    }
    // === MEMBER (Depósito) ===
    else if (Auth.isMember()) {
      document.getElementById('welcome-title').textContent = `¡Hola, ${userName}!`;
      document.getElementById('welcome-subtitle').textContent =
        'Estas son las solicitudes aprobadas listas para entregar.';
      document.getElementById('welcome-actions').innerHTML = `
        <a href="/pages/deposit-view.html" class="btn-page-primary">
          <i data-lucide="package-check" class="w-4 h-4 mr-1"></i> Por entregar
        </a>`;

      renderDepositStats();
      renderQuickAccess([
        { icon: 'package-check', title: 'Por Entregar', desc: 'Solicitudes aprobadas',  href: '/pages/deposit-view.html' },
        { icon: 'package',       title: 'Inventario',   desc: 'Ver y actualizar stock', href: '/pages/inventory.html' },
        { icon: 'clipboard-list',title: 'Historial',    desc: 'Entregas pasadas', href: '/pages/history.html' },
        { icon: 'user-cog',      title: 'Mi Perfil',    desc: 'Mis datos',  href: '/pages/profile.html' },
      ]);
    }
    // === ADMIN / SUPERADMIN ===
    else {
      document.getElementById('welcome-title').textContent = `Panel de ${Auth.getReadableRole()}`;
      document.getElementById('welcome-subtitle').textContent =
        'Resumen general del sistema de inventario.';
      document.getElementById('welcome-actions').innerHTML = `
        <a href="/pages/dashboard.html" class="btn-page-primary">
          <i data-lucide="layout-dashboard" class="w-4 h-4 mr-1"></i> Ver Dashboard
        </a>`;

      renderAdminStats();
      renderQuickAccess([
        { icon: 'layout-dashboard', title: 'Dashboard', desc: 'KPIs y métricas',     href: '/pages/dashboard.html' },
        { icon: 'users',         title: 'Miembros',    desc: 'Gestionar usuarios',   href: '/pages/admin-users.html' },
        { icon: 'package',       title: 'Materiales',  desc: 'Gestionar inventario', href: '/pages/inventory.html' },
        { icon: 'bar-chart-2',   title: 'Análisis',    desc: 'Reportes y gráficos',  href: '/pages/analytics.html' },
      ]);
      mostrarRecientes();
    }

    /* ============================================================
       STATS POR ROL
    ============================================================ */
    async function renderViewerStats() {
      // Datos del solicitante: cuántas creó, cuántas aprobadas, cuántas pendientes
      try {
        const res = await fetch('/api/transactions/me', { credentials: 'include' });
        const lista = res.ok ? await res.json() : [];
        const total = lista.length;
        const pend  = lista.filter(t => ['PENDING','Pendiente'].includes(t.status)).length;
        const apr   = lista.filter(t => ['APPROVED','Aprobada','COMPLETED','Entregada'].includes(t.status)).length;
        const rej   = lista.filter(t => ['REJECTED','Rechazada'].includes(t.status)).length;
        QO.renderStatCards('home-stats', [
          { label: 'Mis solicitudes',  value: total, icon: 'clipboard-list', colorClass: 'stat-icon-blue' },
          { label: 'Pendientes',       value: pend,  icon: 'clock',          colorClass: 'stat-icon-yellow' },
          { label: 'Aprobadas',        value: apr,   icon: 'check-circle',   colorClass: 'stat-icon-green' },
          { label: 'Rechazadas',       value: rej,   icon: 'x-circle',       colorClass: 'stat-icon-orange' },
        ]);
      } catch {
        QO.renderStatCards('home-stats', [
          { label: 'Mis solicitudes', value: 0, icon: 'clipboard-list', colorClass: 'stat-icon-blue' },
        ]);
      }
    }

    async function renderManagerStats() {
      try {
        const res = await fetch('/api/transactions', { credentials: 'include' });
        const lista = res.ok ? await res.json() : [];
        const pend = lista.filter(t => ['PENDING','Pendiente'].includes(t.status)).length;
        const apr  = lista.filter(t => ['APPROVED','Aprobada'].includes(t.status)).length;
        QO.renderStatCards('home-stats', [
          { label: 'Por aprobar',  value: pend, icon: 'clock',        colorClass: 'stat-icon-yellow' },
          { label: 'Aprobadas hoy', value: apr, icon: 'check-circle', colorClass: 'stat-icon-green' },
          { label: 'Total mes',    value: lista.length, icon: 'bar-chart-2', colorClass: 'stat-icon-blue' },
        ]);
      } catch { QO.renderStatCards('home-stats', []); }
    }

    async function renderDepositStats() {
      try {
        const res = await fetch('/api/transactions/approved', { credentials: 'include' });
        const lista = res.ok ? await res.json() : [];
        QO.renderStatCards('home-stats', [
          { label: 'Por entregar',  value: lista.length, icon: 'package',       colorClass: 'stat-icon-yellow' },
          { label: 'Entregadas hoy', value: 0,            icon: 'package-check', colorClass: 'stat-icon-green' },
        ]);
      } catch { QO.renderStatCards('home-stats', []); }
    }

    async function renderAdminStats() {
      try {
        const [rTxn, rItems] = await Promise.all([
          fetch('/api/transactions', { credentials: 'include' }),
          fetch('/api/items',        { credentials: 'include' }),
        ]);
        const txns  = rTxn.ok   ? await rTxn.json()  : [];
        const items = rItems.ok ? await rItems.json(): [];
        const pend  = txns.filter(t => ['PENDING','Pendiente'].includes(t.status)).length;
        const low   = items.filter(i => ['LOW','Stock Bajo'].includes(i.status)).length;
        QO.renderStatCards('home-stats', [
          { label: 'Materiales', value: items.length, icon: 'package',        colorClass: 'stat-icon-blue' },
          { label: 'Stock bajo', value: low,          icon: 'alert-triangle', colorClass: 'stat-icon-orange' },
          { label: 'Pendientes', value: pend,         icon: 'clock',          colorClass: 'stat-icon-yellow' },
          { label: 'Total txns', value: txns.length,  icon: 'bar-chart-2',    colorClass: 'stat-icon-green' },
        ]);
      } catch { QO.renderStatCards('home-stats', []); }
    }

    /* ============================================================
       ACCESOS RÁPIDOS
    ============================================================ */
    function renderQuickAccess(items) {
      document.getElementById('quick-access').innerHTML = items.map(it => `
        <a href="${it.href}" class="quick-card">
          <div class="quick-card-bg-icon"><i data-lucide="${it.icon}" class="w-16 h-16 text-secondary"></i></div>
          <div class="quick-card-icon"><i data-lucide="${it.icon}" class="w-5 h-5"></i></div>
          <h3 class="quick-card-title">${it.title}</h3>
          <p class="quick-card-desc">${it.desc}</p>
        </a>`).join('');
      lucide.createIcons();
    }

    /* ============================================================
       TABLA DE ACTIVIDAD RECIENTE (admin/manager)
    ============================================================ */
    async function mostrarRecientes() {
      const panel = document.getElementById('recent-panel');
      panel.style.display = 'block';
      try {
        const res = await fetch('/api/transactions', { credentials: 'include' });
        const lista = res.ok ? await res.json() : [];
        const datos = lista.slice(0, 5).map(txn => ({
          id:        (txn.id || '').length > 12 ? `TXN-${txn.id.substring(0, 8).toUpperCase()}` : txn.id,
          fullId:    txn.id,
          requester: txn.requesterName || '—',
          item:      txn.itemName || '—',
          qty:       `${txn.quantity || 0} ${txn.itemUnit || ''}`,
          type:      txn.type || 'OUT',
          date:      txn.createdAt || '',
          status:    txn.status,
        }));
        QO.renderTransactionRows('recent-tbody', datos);
      } catch {}
    }

    lucide.createIcons();
  </script>
</body>
</html>

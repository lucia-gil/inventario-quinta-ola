<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial | Quinta Ola</title>
  <link href="/src/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-body">

  <main class="page-main">

    <div class="page-header">
      <div>
        <h1 class="page-title" id="page-title">Historial</h1>
        <p class="page-subtitle" id="page-subtitle">Cargando...</p>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="search-bar">
      <div class="search-input-wrap">
        <i data-lucide="search" class="input-icon-left"></i>
        <input type="text" id="search-input" placeholder="Buscar..." class="input-icon"
               oninput="filtrar()" />
      </div>
      <div class="flex gap-3">
        <select id="filter-status" class="select-page w-auto" onchange="filtrar()">
          <option value="">Todos los estados</option>
          <option value="Pendiente">Pendiente</option>
          <option value="Aprobada">Aprobada</option>
          <option value="Rechazada">Rechazada</option>
          <option value="Entregada">Entregada</option>
        </select>
      </div>
    </div>

    <div class="table-panel">
      <div class="table-wrapper">
        <table class="table">
          <thead class="table-head">
            <tr>
              <th class="th">ID</th>
              <th class="th">Solicitante</th>
              <th class="th">Material</th>
              <th class="th-center">Cantidad</th>
              <th class="th-center">Tipo</th>
              <th class="th">Fecha</th>
              <th class="th-center">Estado</th>
              <th class="th-center">Detalle</th>
            </tr>
          </thead>
          <tbody id="history-tbody" class="table-body"></tbody>
        </table>
      </div>

      <div class="panel-footer">
        <p class="panel-count-text" id="history-count">Mostrando 0 items</p>
        <div id="history-pagination"></div>
      </div>
    </div>

  </main>

  <script src="/src/auth.js"></script>
  <script src="/src/ui.js"></script>
  <script>
    if (!Auth.requireLogin()) throw new Error('No auth');

    QO.navbar({
      active:   'history',
      name:     Auth.getUserName(),
      role:     Auth.getReadableRole(),
      menuType: Auth.getMenuType(),
    });
    QO.footer();

    // Título y subtítulo según rol
    if (Auth.isViewer()) {
      document.getElementById('page-title').textContent = 'Mi Historial';
      document.getElementById('page-subtitle').textContent = 'Todas las solicitudes que has hecho';
    } else {
      document.getElementById('page-title').textContent = 'Historial Completo';
      document.getElementById('page-subtitle').textContent = 'Todas las solicitudes del sistema';
    }

    const STATUS_MAP = {
      'PENDING':'Pendiente','APPROVED':'Aprobada',
      'REJECTED':'Rechazada','COMPLETED':'Entregada',
    };
    const normalize = (s) => STATUS_MAP[s] || s || 'Pendiente';

    let todasLasTxns = [];

    async function cargar() {
      try {
        // Viewer: solo las suyas; resto: todas
        const endpoint = Auth.isViewer() ? '/api/transactions/me' : '/api/transactions';
        const res = await fetch(endpoint, { credentials: 'include' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        todasLasTxns = await res.json();
        filtrar();
      } catch (err) {
        document.getElementById('history-count').textContent = `Error: ${err.message}`;
      }
    }

    function filtrar() {
      const q     = (document.getElementById('search-input').value || '').toLowerCase();
      const stat  = document.getElementById('filter-status').value;

      const filtradas = todasLasTxns.filter(t => {
        const statusEs = normalize(t.status);
        if (stat && statusEs !== stat) return false;
        if (!q) return true;
        return (t.itemName || '').toLowerCase().includes(q) ||
               (t.requesterName || '').toLowerCase().includes(q) ||
               (t.id || '').toLowerCase().includes(q);
      });

      const datos = filtradas.map(txn => ({
        id:        (txn.id || '').length > 12 ? `TXN-${txn.id.substring(0, 8).toUpperCase()}` : txn.id,
        fullId:    txn.id,
        requester: txn.requesterName || Auth.getUserName(),
        item:      txn.itemName || '—',
        qty:       `${txn.quantity || 0} ${txn.itemUnit || ''}`,
        type:      txn.type || 'OUT',
        date:      txn.createdAt || '',
        status:    normalize(txn.status),
      }));

      QO.renderTransactionRows('history-tbody', datos);
      document.getElementById('history-count').textContent =
        `Mostrando ${datos.length} de ${todasLasTxns.length} solicitudes`;
    }

    cargar();
  </script>
</body>
</html>
